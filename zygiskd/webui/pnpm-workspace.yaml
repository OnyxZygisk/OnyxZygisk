# pnpm 11: package-manager settings live in pnpm-workspace.yaml (the `pnpm`
# field in package.json is no longer read). These postinstall scripts are
# approved so their native binaries are set up; without this pnpm blocks them
# and vite / tailwind break at runtime.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
minimumReleaseAgeExclude:
  - kernelsu-alt@3.1.2
