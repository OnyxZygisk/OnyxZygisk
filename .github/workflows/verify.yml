name: Verify

on:
  push:
  pull_request:

jobs:
  zygote-jni:
    name: Zygote JNI hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Nubia JNI signatures and generated hooks
        run: python3 loader/src/injector/test_jni_hooks.py

  zigcore:
    name: Zig core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Run Zig tests
        working-directory: loader/zigcore
        run: zig build test --summary all

  webui:
    name: WebUI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: zygiskd/webui
        run: pnpm install --frozen-lockfile
      # biome ci, not pnpm lint: the lint script rewrites files, which a check
      # job must never do.
      - name: Format and lint
        working-directory: zygiskd/webui
        run: pnpm check:biome
      - name: Type-check
        working-directory: zygiskd/webui
        run: pnpm type-check
      # The unit guards scan the real build output (the compiled stylesheet and
      # the emitted scripts), so they need a build first.
      - name: Build
        working-directory: zygiskd/webui
        run: pnpm build
      - name: Unit guards
        working-directory: zygiskd/webui
        run: pnpm test
      - name: Install Playwright browsers
        working-directory: zygiskd/webui
        run: pnpm exec playwright install --with-deps chromium
      - name: Behaviour and accessibility
        working-directory: zygiskd/webui
        run: pnpm test:e2e

  android:
    name: Android release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # build.gradle.kts derives verCode from `git rev-list HEAD --count`,
          # which returns 1 on the default shallow (fetch-depth: 1) clone.
          # Without full history the released module reports versionCode 4
          # instead of the real commit count.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # v3 defaults its `packages` input to 'tools platform-tools', but Google
      # has removed the `tools` package from the SDK repository, so the action
      # aborts before anything is built:
      #     Warning: Failed to find package 'tools'
      #     Error: sdkmanager failed with exit code 1
      # v4.0.2 fixes exactly this; its default is 'platform-tools' only. The
      # explicit sdkmanager step below still installs every component we need.
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Build release module
        env:
          # setup-rust-toolchain enables -D warnings globally. The existing
          # Android build is warning-clean only for its own crate flags, while
          # dependency diagnostics are not part of this release gate.
          RUSTFLAGS: ""
        run: bash ./gradlew :module:zipRelease --no-daemon --console=plain
      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: onyxzygisk-release
          path: module/build/outputs/release/*.zip
